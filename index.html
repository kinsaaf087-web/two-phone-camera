<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Two Phone Camera Test</title>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    video {
      width: 100%;
      max-width: 500px;
      background: black;
      margin-top: 15px;
    }

    button {
      padding: 12px 18px;
      margin: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    #qrcode {
      margin: 20px auto;
      width: 256px;
    }

    #status {
      font-weight: bold;
    }
  </style>
</head>

<body>

<h2>Two-Phone Camera Test</h2>

<p id="status">Starting...</p>

<button id="createRoomBtn" onclick="createRoom()">
  Create Room
</button>

<div id="qrcode"></div>

<p id="scanMessage"></p>

<h3>Your Camera</h3>
<video id="localVideo" autoplay muted playsinline></video>

<h3>Remote Camera</h3>
<video id="remoteVideo" autoplay playsinline></video>

<script>

let peer;
let localStream = null;
let hostId = null;

const statusText = document.getElementById("status");
const remoteVideo = document.getElementById("remoteVideo");
const localVideo = document.getElementById("localVideo");


// Start PeerJS
peer = new Peer();

peer.on("open", function(id) {

  hostId = id;

  statusText.innerHTML =
    "Ready. Create a room or scan a room QR.";

  checkForRoom();
});


// Someone is calling this phone
peer.on("call", async function(call) {

  const consent = confirm(
    "Another phone wants to view your camera. Allow?"
  );

  if (!consent) {
    call.close();
    return;
  }

  try {

    localStream =
      await navigator.mediaDevices.getUserMedia({
        video: true,
        audio: false
      });

    localVideo.srcObject = localStream;

    call.answer(localStream);

    call.on("stream", function(remoteStream) {

      remoteVideo.srcObject = remoteStream;

      statusText.innerHTML =
        "Connected successfully.";

    });

  } catch (error) {

    alert("Camera permission was denied.");

    console.error(error);
  }
});


// Create room on Phone A
async function createRoom() {

  if (!hostId) {
    alert("Please wait for connection.");
    return;
  }

  try {

    localStream =
      await navigator.mediaDevices.getUserMedia({
        video: true,
        audio: false
      });

    localVideo.srcObject = localStream;

  } catch (error) {

    alert("Camera permission was denied.");
    return;
  }

  const roomUrl =
    window.location.origin +
    window.location.pathname +
    "?host=" +
    encodeURIComponent(hostId);

  document.getElementById("qrcode").innerHTML = "";

  new QRCode(document.getElementById("qrcode"), {
    text: roomUrl,
    width: 256,
    height: 256
  });

  statusText.innerHTML =
    "Room created. Ask the second phone to scan this QR code.";

  document.getElementById("scanMessage").innerText =
    "Scan this QR code with Phone B.";
}


// Phone B detects host ID from QR/link
function checkForRoom() {

  const params = new URLSearchParams(
    window.location.search
  );

  const host = params.get("host");

  if (!host) {
    return;
  }

  document.getElementById("createRoomBtn").style.display =
    "none";

  document.getElementById("scanMessage").innerText =
    "Room found. Connecting...";

  statusText.innerHTML =
    "Waiting for camera permission...";

  connectToHost(host);
}


// Phone B connects automatically
async function connectToHost(host) {

  try {

    const permission =
      confirm(
        "This test will share your camera with the other phone. Continue?"
      );

    if (!permission) {

      statusText.innerHTML =
        "Camera sharing cancelled.";

      return;
    }

    localStream =
      await navigator.mediaDevices.getUserMedia({
        video: true,
        audio: false
      });

    localVideo.srcObject = localStream;

    const call =
      peer.call(host, localStream);

    call.on("stream", function(remoteStream) {

      remoteVideo.srcObject =
        remoteStream;

      statusText.innerHTML =
        "Connected successfully.";

    });

    call.on("close", function() {

      statusText.innerHTML =
        "Connection closed.";

    });

    call.on("error", function(error) {

      console.error(error);

      statusText.innerHTML =
        "Connection error.";

    });

  } catch (error) {

    console.error(error);

    alert(
      "Camera permission was denied or unavailable."
    );
  }
}

</script>

</body>
</html>
